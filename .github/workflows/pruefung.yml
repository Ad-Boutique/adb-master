name: Pruefung
# Laeuft bei jedem Pull Request und bei jedem Push auf main. Die drei Jobs build, links und secrets
# sind im Ruleset fuer main als Pflicht-Checks eingetragen (docs/GITHUB-EINSTELLUNGEN.md).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pruefung-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Linux: der Build braucht nur Python und Pillow. Er baut in einer Kopie und schreibt nach public/.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # _seo.py liest Aenderungsdaten aus git log
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pakete
        run: pip install pillow
      - name: Ganze Build-Kette in der verbindlichen Reihenfolge
        run: sh _build.sh public
      - name: Der Build darf das Repo nicht veraendern
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Der Build hat Dateien im Repo geaendert:"; git status --porcelain | head -40; exit 1
          fi

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pakete
        run: pip install pillow
      - name: Bauen (enthaelt _check.py, assets-Referenzen gegen .distignore)
        run: sh _build.sh public
      - name: Interne Links, eingebundene Dateien, HTML-Struktur der ausgelieferten Seiten
        run: python3 _tools/linkcheck.py public

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret-Scan (TruffleHog)
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85  # v3.97.9, fest gepinnt
        with:
          extra_args: --results=verified,unknown
